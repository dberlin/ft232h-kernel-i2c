PACKAGE_NAME="ft232h_i2c"
PACKAGE_VERSION="1.0"

# Build against the target kernel DKMS is installing for (not `uname -r`),
# so rebuilds on kernel upgrade use the right headers.
MAKE[0]="make KDIR=${kernel_source_dir}"

BUILT_MODULE_NAME[0]="ft232h_i2c"
DEST_MODULE_LOCATION[0]="/updates"

# Rebuild automatically whenever a new kernel is installed.
AUTOINSTALL="yes"
