# Persistent I2C bus speed for the FT232H driver, in Hz.
# Install: sudo cp ft232h_i2c.conf /etc/modprobe.d/ft232h_i2c.conf
#
# 100000 (100 kHz) is the driver default and works on a well-built bus with
# strong (~2.2k) pull-ups and short wiring. If reads come back corrupt, the
# bus RC is too slow for this rate - lower it here (e.g. speed=50000 or
# speed=15000) or improve the pull-ups/capacitance. Max useful ~400000.
options ft232h_i2c speed=100000
